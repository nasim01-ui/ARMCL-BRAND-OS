<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AKIJ Ready Mix BrandOS · Login</title>
<link rel="stylesheet" href="/web/style.css" />
<script>
if (sessionStorage.getItem("brandos_token")) {
  location.replace("/dashboard");
}
</script>
</head>
<body>
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <span class="logo big">ARM</span>
      <h1>AKIJ Ready Mix</h1>
      <h2>BrandOS</h2>
      <p class="login-tag">AI Powered Business Command Center</p>
      <p class="login-sub">One operating system for brand, sales, market intelligence &amp; growth</p>
    </div>
    <form id="login-form" class="login-form" autocomplete="off">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="password" autocomplete="off" />
      <div id="login-error" class="login-error" hidden></div>
      <button type="submit" class="btn login-btn">LOGIN</button>
      <a href="#" class="forgot">Forgot Password?</a>
    </form>
  </div>
</div>
<script src="/web/app.js"></script>
</body>
</html>
